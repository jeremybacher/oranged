name: Security

# Two different questions: does what we have installed carry known holes, and does our own code
# fall into a dangerous pattern.
#
# It also runs by itself on Mondays, which is the trigger that does the real work: push and
# pull_request only answer "does what I just wrote bring something bad", but advisories are
# published later. A clean lockfile stops being clean without anyone touching the repo. The cron
# only runs on the default branch, and GitHub disables it after 60 days without repository activity.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: yarn

      - run: yarn install --frozen-lockfile

      # What travels inside the zip that people install and run in their browser: any advisory
      # here deserves a read before publishing, so the bar is low.
      #
      # yarn 1 exits with a bitmask (1 info, 2 low, 4 moderate, 8 high, 16 critical) and `--level`
      # only filters what is printed, not the exit code. So the threshold is applied here: fail
      # only when a bit at or above the bar is set.
      - name: Audit what ships
        run: |
          code=0
          yarn audit --groups dependencies --level moderate || code=$?
          [ $((code & 28)) -eq 0 ]

      # Webpack, jest and the rest never reach anyone's browser. They matter (they build the zip)
      # but the bar is the serious one, so a minor advisory in test tooling does not block a fix.
      - name: Audit the build and test tooling
        run: |
          code=0
          yarn audit --groups devDependencies --level high || code=$?
          [ $((code & 24)) -eq 0 ]

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      # No build step on purpose: CodeQL reads the TypeScript source. Analysing the webpack bundle
      # would be analysing minified code with React inside, which is noise.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
